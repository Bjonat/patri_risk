[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patri_risk"
version = "0.1.0.dev0"
description = "Moteur open source d'agrégation de preuves publiques relatives aux monuments historiques français."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Jonathan Boussard" }]
keywords = [
    "patrimoine",
    "monuments-historiques",
    "open-data",
    "preuves",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: French",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
patri-risk = "patri_risk.cli:point_entree"

[project.urls]
Repository = "https://github.com/Bjonat/patri_risk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patri_risk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
